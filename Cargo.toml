[workspace]
members = [
    "rcompare_common",
    "rcompare_core",
    "rcompare_cli",
    "rcompare_gui",  # DEPRECATED: Use teczka instead
    "rcompare_ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["RCompare Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aecs4u/rcompare"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem and I/O
jwalk = "0.8"
ignore = "0.4"

# Hashing
blake3 = "1.5"
hex = "0.4"

# Serialization
bincode = "1.3"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"

# Diffing
similar = { version = "2.6", features = ["inline"] }

# Syntax highlighting
syntect = "5.2"

# Image processing
image = "0.25"
kamadak-exif = "0.5"

# CSV processing
csv = "1.3"

# Excel processing
calamine = "0.26"

# JSON/YAML processing
serde_yml = "0.0.12"

# DataFrame/Parquet processing
polars = { version = "0.46", features = ["parquet", "lazy", "rows", "dtype-full"] }

# Archive handling
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
sevenz-rust = "0.6"
bzip2 = "0.5"
xz2 = "0.1"
unrar = "0.5"

# Pattern matching
glob = "0.3"
regex = "1.10"

# Concurrency
rayon = "1.10"
crossbeam = "0.8"

# Platform-specific paths
directories = "5.0"

# Trash
trash = "5.0"

# GUI (Slint is deprecated — kept for rcompare_gui backward compat)
slint = { version = "1.14", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
filetime = "0.2"
tempfile = "3.8"

# SSH/SFTP
ssh2 = "0.9"

# Cloud storage - S3
aws-config = "1.5"
aws-sdk-s3 = "1.119"
aws-credential-types = "1.2"

# Cloud storage - WebDAV and HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
bytes = "1.5"
async-trait = "0.1"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
url = "2.5"

# Benchmarking (dev dependency)
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
strip = true

# Used only for packaged release artifacts (see .github/workflows/release.yml).
# Whole-crate LTO + codegen-units=1 cuts binary size noticeably but multiplies
# clean-build time (~15s -> ~6min for rcompare_cli in local testing), so it must
# stay out of the default `release` profile used by everyday `cargo build --release`
# and CI (`ci.yml` builds --release on every push).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
# === Allowed (legitimate patterns in this codebase) ===
too_many_arguments = "allow"        # Many functions need numerous config parameters
type_complexity = "allow"           # Complex types are sometimes necessary
enum_variant_names = "allow"        # Not always possible to use different names
collapsible_else_if = "allow"       # Sometimes more readable expanded
needless_range_loop = "allow"       # Sometimes more readable with index

# === Correctness & Safety ===
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
float_cmp = "warn"
invalid_upcast_comparisons = "warn"
suspicious_operation_groupings = "warn"
suspicious_xor_used_as_pow = "warn"
fallible_impl_from = "warn"
debug_assert_with_mut_call = "warn"
unused_result_ok = "warn"
unused_async = "warn"

# === Performance ===
trivially_copy_pass_by_ref = "warn"
large_types_passed_by_value = "warn"
needless_pass_by_value = "warn"
needless_pass_by_ref_mut = "warn"
implicit_clone = "warn"
redundant_clone = "warn"
needless_collect = "warn"
stable_sort_primitive = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"

# === Style & Clarity ===
uninlined_format_args = "warn"
manual_let_else = "warn"
manual_assert = "warn"
manual_ok_or = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
match_bool = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
bool_to_int_with_if = "warn"
equatable_if_let = "warn"
flat_map_option = "warn"
filter_map_next = "warn"
from_iter_instead_of_collect = "warn"
map_unwrap_or = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
expl_impl_clone_on_copy = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_on_empty_collections = "warn"
iter_with_drain = "warn"
option_as_ref_cloned = "warn"
question_mark = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"

# === Code Organization ===
wildcard_imports = "warn"
enum_glob_use = "warn"
macro_use_imports = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_bitwise_bool = "warn"
needless_raw_strings = "warn"
unnecessary_wraps = "warn"
unnecessary_join = "warn"
unnecessary_box_returns = "warn"
unnested_or_patterns = "warn"
string_add_assign = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
ref_option_ref = "warn"
same_functions_in_if_condition = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
lossy_float_literal = "warn"
pathbuf_init_then_push = "warn"
path_buf_push_overwrite = "warn"
trivial_regex = "warn"
used_underscore_binding = "warn"
unused_self = "warn"
mut_mut = "warn"
ignored_unit_patterns = "warn"
empty_enum_variants_with_brackets = "warn"
error_impl_error = "warn"
