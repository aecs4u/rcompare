[package]
name = "rcompare_cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `full` is the default and matches the previously hardcoded feature set, so
# a plain `cargo build`/`cargo install` is unchanged. Build a smaller binary
# with fewer transitive deps via:
#   cargo build -p rcompare_cli --no-default-features                 # minimal
#   cargo build -p rcompare_cli --no-default-features -F archives     # + archives
#   cargo build -p rcompare_cli --no-default-features -F csv-diff     # one format
# A minimal build keeps directory/text/binary comparison, hashing, sync and
# copy; it drops archive sources and the specialized format engines.
default = ["full"]
full = ["archives", "specialized"]

archives = ["rcompare_core/archives"]

specialized = ["csv-diff", "excel-diff", "json-diff", "parquet-diff", "image-diff"]
csv-diff = ["rcompare_core/csv-diff"]
excel-diff = ["rcompare_core/excel-diff"]
json-diff = ["rcompare_core/json-diff"]
parquet-diff = ["rcompare_core/parquet-diff"]
image-diff = ["rcompare_core/image-diff"]

[dependencies]
rcompare_common = { path = "../rcompare_common" }
rcompare_core = { path = "../rcompare_core", default-features = false }

clap.workspace = true
anyhow.workspace = true
ctrlc = { version = "3.4", features = ["termination"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
indicatif.workspace = true
regex.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

# Matches the archive naming produced by .github/workflows/release.yml,
# e.g. rcompare_cli-v0.2.0-x86_64-unknown-linux-gnu.tar.gz
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dev-dependencies]
tempfile.workspace = true
filetime.workspace = true
assert_cmd = "2.0"
