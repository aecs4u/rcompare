[project]
name = "teczka"
version = "0.1.0"
description = "PySide6 GUI frontend for RCompare file comparison tool"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
full = [
    "structlog>=24.1.0",
    "fluent.runtime>=0.4.0",
    "typer>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
teczka = "teczka.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true
# PySide6 exposes many compatibility enum aliases dynamically and its model
# callback stubs are narrower than Qt's accepted Python overrides.
disable_error_code = ["attr-defined", "override"]
